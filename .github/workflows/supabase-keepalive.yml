name: Supabase keepalive

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query settings table to keep project active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secrets are not set" >&2
            exit 1
          fi

          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/settings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          cat /tmp/response.json
          echo "HTTP status: ${http_status}"

          if [ "$http_status" -ge 400 ]; then
            echo "Keepalive query failed with status ${http_status}" >&2
            exit 1
          fi
